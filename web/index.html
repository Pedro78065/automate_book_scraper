<!DOCTYPE html>
<html>
    <head>
        <title>API_Scraper</title>
        <link rel = "stylesheet" href = "style.css" />
        <script src = "script.js" defer></script>
    </head>
    <body>
        <h1>Web API</h1>
        <h2>feita em python</h2>
        <img src = "https://th.bing.com/th/id/ODF.v-ppV9wNpexjo8ic-CwWig?w=32&h=32&qlt=90&pcl=fffffa&o=6&pid=1.2" alt = "Imagem_book_to_Scraper(recarregue a página)"/>
        <a href = "https://books.toscrape.com/">link do site</a>
        <div class = "bt">
            <p>clique no botão para ver se a api está no ar: </p>
            <button class = "botao1" name = "bt_enviar1" id = "bt_enviar1">AQUI</button>
        </div>
        <div class = "bt">
            <p>clique no botão e espere "10 segundos" para coletar os dados do scraper(1 passo):</p>
            <button class = "botao2" name = "bt_enviar2" id = "bt_enviar2">AQUI</button>
        </div>
        <div class = "bt">
            <p>clique no botão para ver todos os livros coletados(2 passo):</p>
            <button class = "botao3" name = "bt_enviar3" id = "bt_enviar3" >AQUI</button>
        </div>
        <div class = bt>
            <label id = "nome_preco">Preço:</label>
            <input id = "filtro" placeholder = "Digite o preço máximo..."/>
            <button id = "buscar">Buscar</button>
        </div>
        <div class = "bt">
            <label id = "nome_name">Nome:</label>
            <input id = "filtro_name" placeholder = "Digite o nome do livro..."/>
            <button id = "buscar_name">Buscar</button>
        </div>
        <div class = "bt">
            <button id = "deletar">DELETAR</button>
        </div>
        <div id = "resultado"></div>
        <footer>feito por: Pedro.H.C</footer>
    </body>
</html>
